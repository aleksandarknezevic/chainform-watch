# Runs `chainform plan` for every config under watch/ and turns on-chain drift
# into GitHub issues and pull requests.
#
#   schedule / push / manual run:
#     drift     -> open an issue "Drift: <file>" (comment only if the drift changes)
#                  and a PR from drift/<name> that rewrites the expected values
#                  to the on-chain ones; merging the PR acknowledges the change
#     no drift  -> close the issue and any open drift PR for that file
#   pull_request:
#     the job fails on drift, so nothing that disagrees with the chain - a stale
#     baseline, a typo - can merge
#
# Nothing is signed or sent: `plan` only performs eth_call reads.
#
# Secrets:
#   RPC_URL      (required) Ethereum mainnet JSON-RPC endpoint
#   WATCH_TOKEN  (optional) fine-grained PAT with contents, issues and pull
#                requests write. PRs opened with the default GITHUB_TOKEN do not
#                trigger workflows, so the PR check would not run on drift PRs.
#                Without it, enable "Allow GitHub Actions to create and approve
#                pull requests" in Settings -> Actions -> General.

name: watch

on:
  schedule:
    # Off the top of the hour to avoid the scheduler rush.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: false

env:
  CHAINFORM_VERSION: v0.0.3

jobs:
  discover:
    name: Discover configs
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.find.outputs.files }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        run: |
          files=$(find watch -name '*.hcl' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Watching: ${files}"

  plan:
    name: ${{ matrix.file }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    env:
      FILE: ${{ matrix.file }}
      GH_TOKEN: ${{ secrets.WATCH_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WATCH_TOKEN || github.token }}

      - name: chainform plan
        id: plan
        uses: aleksandarknezevic/chainform@v0.0.3
        with:
          file: ${{ matrix.file }}
          rpc-url: ${{ secrets.RPC_URL }}
          version: ${{ env.CHAINFORM_VERSION }}
          json: "true"
          # Outside PRs drift is reported as an issue + PR, not a red build.
          fail-on-drift: ${{ github.event_name == 'pull_request' }}

      - name: Open or update drift issue
        id: issue
        if: github.event_name != 'pull_request' && steps.plan.outputs.drift == 'true'
        env:
          PLAN_FILE: ${{ steps.plan.outputs.plan-file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Drift: ${FILE}"
          # Hash the plan so an unchanged drift does not comment every hour.
          sha=$(sha256sum "$PLAN_FILE" | cut -c1-16)

          {
            echo "On-chain state no longer matches \`${FILE}\`."
            echo
            echo '```'
            cat "$PLAN_FILE"
            echo '```'
            echo
            echo "Detected by [run ${GITHUB_RUN_ID}](${RUN_URL}). The change happened at or before this run - check the contract's transactions/events for the exact time."
            echo
            echo "A PR updating \`${FILE}\` to the on-chain values is opened automatically. Verify the change is legitimate, describe it and link the proposal or transaction in the PR, then merge it to close this issue."
            echo
            echo "<!-- plan-sha: ${sha} -->"
          } > "$RUNNER_TEMP/issue.md"

          gh label create drift --color B60205 --description "On-chain state differs from config" 2>/dev/null || true

          number=$(gh issue list --state open --label drift --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [ -z "$number" ]; then
            url=$(gh issue create --title "$title" --label drift --body-file "$RUNNER_TEMP/issue.md")
            number=${url##*/}
          elif gh issue view "$number" --json body,comments --jq '.body, .comments[].body' | grep -q "plan-sha: ${sha}"; then
            echo "Issue #${number} already reports this plan."
          else
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Open or update drift PR
        if: steps.issue.outcome == 'success'
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan-json-file }}
          ISSUE: ${{ steps.issue.outputs.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          slug=${FILE#watch/}
          slug=${slug%.hcl}
          branch="drift/${slug//\//-}"
          issue_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${ISSUE}"

          python3 scripts/rebaseline.py --file "$FILE" --plan "$PLAN_JSON" \
            --summary "$RUNNER_TEMP/changes.md" --post "$RUNNER_TEMP/post.txt" --link "$issue_url"
          rewrite=$?
          if [ "$rewrite" -eq 2 ]; then
            exit 2
          fi

          # The rewritten file must match the chain, or the PR is only a draft.
          verified=true
          chainform plan -f "$FILE" > "$RUNNER_TEMP/verify.txt" || verified=false

          set -e
          if git fetch --quiet origin "$branch" 2>/dev/null \
             && git show "FETCH_HEAD:${FILE}" | cmp -s - "$FILE"; then
            echo "${branch} already carries these values."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add "$FILE"
            git commit -m "Acknowledge drift in ${FILE}" -m "Closes #${ISSUE}"
            git push --force origin "$branch"
          fi

          {
            echo "Updates \`${FILE}\` to the values currently on chain. Closes #${ISSUE}."
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            if [ "$verified" = true ]; then
              echo "Re-running \`chainform plan\` on the updated file: **no drift**."
            else
              echo "**The updated file still drifts** - finish it by hand:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/verify.txt"
              echo '```'
            fi
            echo
            echo "### Before merging"
            echo
            echo "- [ ] The change is legitimate: it came from the expected owner/governance (find the transaction or event on the explorer)."
            echo "- [ ] Each \`TODO\` comment is replaced with what the new value is and a link to the proposal or transaction."
            echo
            echo "### Draft post for X"
            echo
            echo "Post only after the change is verified; add one line of context (what the new value means, link to the proposal)."
            echo
            echo '```'
            cat "$RUNNER_TEMP/post.txt"
            echo '```'
          } > "$RUNNER_TEMP/pr.md"

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/pr.md"
          else
            draft=()
            if [ "$verified" != true ] || [ "$rewrite" -ne 0 ]; then
              draft=(--draft)
            fi
            gh pr create --base "$BASE" --head "$branch" "${draft[@]}" \
              --title "Acknowledge drift: ${FILE}" --label drift --body-file "$RUNNER_TEMP/pr.md"
          fi

      - name: Close resolved drift issue and PR
        if: github.event_name != 'pull_request' && steps.plan.outputs.drift == 'false'
        run: |
          set -euo pipefail
          title="Drift: ${FILE}"
          slug=${FILE#watch/}
          slug=${slug%.hcl}
          branch="drift/${slug//\//-}"
          number=$(gh issue list --state open --label drift --limit 100 --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty" 2>/dev/null || true)
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "\`${FILE}\` matches the chain again (${GITHUB_SHA::7})."
          fi
          # A drift PR still open here means the chain went back on its own.
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            gh pr close "$pr" --delete-branch --comment "\`${FILE}\` matches the chain again without this change."
          fi

  # One stable check name for branch protection, however many files are watched.
  result:
    name: watch result
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.plan.result }}
        run: test "$RESULT" = success
